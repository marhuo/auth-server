<!DOCTYPE html>
<!-- Placeholders: {{AppName}} {{Code}} {{Link}} {{Minutes}}. The title is the subject. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your confirmation code: {{Code}}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e0e0e0;border-radius:12px;font-family:Roboto,Arial,sans-serif;color:#181818;">
<tr><td style="padding:32px;">

<p style="margin:0;font-size:18px;font-weight:700;">{{AppName}}</p>

<h1 style="margin:24px 0 16px;font-size:22px;font-weight:600;">Confirm your email address</h1>

<p style="margin:0 0 16px;font-size:16px;line-height:24px;">Enter this confirmation code to sign in:</p>

<p style="margin:0 0 24px;font-size:32px;font-weight:700;letter-spacing:8px;">{{Code}}</p>

<table role="presentation" cellpadding="0" cellspacing="0"><tr>
<td style="background:#181818;border-radius:8px;">
<a href="{{Link}}" style="display:inline-block;padding:12px 24px;font-size:16px;font-weight:600;color:#ffffff;text-decoration:none;">Confirm and sign in</a>
</td></tr></table>

<p style="margin:24px 0 0;font-size:13px;line-height:20px;color:#666666;">The code is valid for {{Minutes}} minutes. If you did not try to sign in, you can ignore this email.</p>

</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
